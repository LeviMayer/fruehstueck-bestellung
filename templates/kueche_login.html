<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Küchenübersicht – Login</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #fffaf3; color: #2b2320; padding: 40px 16px; }
  form { max-width: 300px; margin: 0 auto; }
  input { width: 100%; padding: 12px; font-size: 1.2rem; text-align: center; border: 1px solid #d8cfc4; border-radius: 8px; margin-bottom: 12px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #d97706; color: white; font-weight: 600; }
  .error { color: #b3261e; text-align: center; }
</style>
</head>
<body>
  <h1 style="text-align:center;">🍳 Küchenübersicht</h1>
  <form method="post">
    <input type="password" name="pin" inputmode="numeric" placeholder="PIN" autofocus>
    <button type="submit">Anmelden</button>
    {% if fehler %}<p class="error">{{ fehler }}</p>{% endif %}
  </form>
</body>
</html>
